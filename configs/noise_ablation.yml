# ------------------------------------------------------------
# Example YAML benchmark config for scripts/run_benchmark.py.
#
# Run:    python scripts/run_benchmark.py configs/demo.yml
# Output: results/yml_bench/<name>/{run.sh, config.yml,
#                                   summary.txt, summary_per_model.txt,
#                                   <model>/<world>[_noise<σ>]_seed<s>.{json,txt,stdout.log}}
#
# Required fields: models, critic, max_rounds, worlds, seeds.
# Optional fields: name, critic_model, judge_model, noise_std,
#                  random_experiments, no_mse.
# ------------------------------------------------------------


# ---------------
# name of the run (subdir under results/yml_bench/).
# default: current timestamp (YYYYMMDD-HHMMSS).
name: production_noise_osc

# -----------------------------------------
# models to test on (will run sequentially)
models:
   - claude-opus-4-7

# ---------------
# use the critic? 'on' / 'off' (or true / false).
critic: off
# what model to use for the critic
critic_model: claude-sonnet-4-6

# ----------------------------------------------------------
# model used by the LLM-judge that scores each agent's prose
# explanation against the world's optimal_explanation.
# default: claude-opus-4-6.
judge_model: claude-opus-4-6

# --------------------------
# max experimentation rounds per trial.
max_rounds: 16

# ---------------------------------
# noise_frac: signal-relative observation noise (the "percentage noise"
# for the world). The σ added to observed particle positions is
# frac * sqrt(Var(GT_world)) — i.e. the noise std as a fraction of the
# per-world ground-truth position std, the same Var(GT) the pass metric
# normalizes MSE by. So 0.05 = 5% noise, 0.4 = 40% noise, comparably
# across worlds regardless of their physical scale.
# Single number or a list (multi-level sweep); in list form each level
# becomes its own trial and gets a "_noise<frac>" output tag.
# Mutually exclusive with a nonzero absolute `noise_std`. default: 0.0.
noise_frac: [0.15, 0.2, 0.25, 0.3, 0.35, 0.40, 0.45, 0.5]   # 0%, 5%, 10%, 20%, 40% noise

# ----------------------------------------------------------
# replace the LLM-driven experiment loop with random-parameter
# experiments (uses --random-experiments / --random-seed).
# 'on' / 'off' (or true / false). default: off.
random_experiments: off

# ----------------------------------------------------------
# allow MSE fitting during rounds
# 'on' / 'off' (or true / false). default: off.
no_mse: off

# --------------------
# which physics worlds. Available: circle, coulomb_easy, dark_matter,
# ether, extra_dimensions, fractional, gravity, hubble, oscillator,
# three_species, yukawa.
worlds:
  - yukawa

# how many rng trials per run (one trial per seed per world per σ).
seeds: [3, 4]
